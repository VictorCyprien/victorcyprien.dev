name: Test and deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

# One deployment per branch at a time, in push order.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SITE_ENV: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Block unfinished content in production
        run: node scripts/check-todo.mjs dist ${{ github.ref_name != 'main' && '--warn' || '' }}
      - name: Keep the preview out of search engines
        if: github.ref_name != 'main'
        run: |
          printf '\n# Preview only\n<IfModule mod_headers.c>\n  Header set X-Robots-Tag "noindex, nofollow"\n</IfModule>\n' >> dist/.htaccess
          # The host lock goes first, so no redirect answers for another host before it.
          { printf '# Preview only: the files answer on the preview host alone.\nRewriteEngine On\nRewriteCond %%{HTTP_HOST} !^preview\\.victorcyprien\\.dev$ [NC]\nRewriteRule ^ - [F]\n\n'; cat dist/.htaccess; } > dist/.htaccess.tmp && mv dist/.htaccess.tmp dist/.htaccess
      # Hostinger allows one Git deployment per website, so both sites live on the deploy branch:
      # production at its root, the preview in preview/, which the preview subdomain points at.
      # Each push replaces only its own part.
      - name: Publish the built site
        if: github.ref_name == 'main' || github.ref_name == 'develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A page or folder named preview in the site would land on top of the preview.
          if [ -e dist/preview ]; then echo "::error::dist/preview would overwrite the preview: rename that page or folder."; exit 1; fi
          git clone --quiet --branch deploy "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" out
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if [ "$GITHUB_REF_NAME" = main ]; then
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name preview -exec rm -rf {} +
            cp -a ../dist/. .
          else
            rm -rf preview
            cp -a ../dist preview
          fi
          git add -A
          git commit --quiet -m "deploy: ${GITHUB_REF_NAME} ${GITHUB_SHA}" || { echo "Nothing to publish"; exit 0; }
          # main and develop can publish at the same time. They touch different folders, so a rebase settles it.
          # Never force: Hostinger only pulls, and a rewritten branch breaks its pull.
          for attempt in 1 2 3; do
            git push --quiet origin HEAD:deploy && exit 0
            git pull --quiet --rebase origin deploy
          done
          exit 1
