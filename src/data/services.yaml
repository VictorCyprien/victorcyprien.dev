- id: reprendre
  order: 1
  title: Reprendre une application existante
  text: "Votre application existe déjà : un prototype, une démo, ou du code écrit par quelqu'un d'autre. Je la remets au propre avant d'y ajouter quoi que ce soit, pour qu'elle reste simple à faire évoluer."
  proof: [contrapp]
- id: developper
  order: 2
  title: Développer le back-end
  text: "L'API, la base de données, la connexion des utilisateurs et les paiements, sur mesure. Je m'appuie sur des briques éprouvées, comme Supabase ou Stripe, plutôt que de tout réécrire."
  proof: [contrapp, aura]
- id: mettre-en-production
  order: 3
  title: Mettre en production
  text: "Je choisis l'hébergement selon votre besoin et votre budget, puis je mets l'application en ligne. Ensuite, publier une nouvelle version, ou revenir à la précédente, se fait en un geste."
  proof: [contrapp, aura]
- id: surveiller
  order: 4
  title: Surveiller et tenir la charge
  text: "Dès la mise en ligne, vous voyez les erreurs, les lenteurs et la charge. Avant une étape de croissance, je mesure la charge que l'application tient, et je corrige ce qui la limite."
  proof: [aura, contrapp]
